<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Noir compliance evidence pipeline</title>
<desc>A capture path where a NIST-tagged Tetragon TracingPolicy produces kernel events that the Noir processor normalizes into attributed findings and batch-writes to ClickHouse, and a serve path where a Go API polls ClickHouse and streams findings to a React dashboard using a timestamp cursor. A replay mode feeds captured events through the same processor without a cluster.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="300" style="fill:rgb(255, 255, 255);stroke:none"/>
<text x="20" y="42" dominant-baseline="central" style="fill:rgb(11, 11, 11);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:start">Capture path</text>
<rect x="20" y="70" width="112" height="48" rx="8" stroke-width="0.5" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29)"/>
<text x="76.0" y="88" dominant-baseline="central" style="fill:rgb(11, 11, 11);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle">TracingPolicy</text>
<text x="76.0" y="104" dominant-baseline="central" style="fill:rgb(95, 94, 90);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle">NIST SI-7 · tagged</text>
<rect x="152" y="70" width="112" height="48" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90)"/>
<text x="208.0" y="88" dominant-baseline="central" style="fill:rgb(11, 11, 11);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Tetragon</text>
<text x="208.0" y="104" dominant-baseline="central" style="fill:rgb(95, 94, 90);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle">eBPF kprobe</text>
<rect x="284" y="70" width="112" height="48" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="340.0" y="88" dominant-baseline="central" style="fill:rgb(11, 11, 11);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Noir processor</text>
<text x="340.0" y="104" dominant-baseline="central" style="fill:rgb(95, 94, 90);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle">normalize · tags</text>
<rect x="416" y="70" width="112" height="48" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="472.0" y="88" dominant-baseline="central" style="fill:rgb(11, 11, 11);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle">row mapper</text>
