<text x="300" y="170" dominant-baseline="central" style="fill:rgb(11, 11, 11);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:start">Serve path</text>
<rect x="548" y="198" width="112" height="48" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90)"/>
<text x="604.0" y="216" dominant-baseline="central" style="fill:rgb(11, 11, 11);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle">Go API</text>
