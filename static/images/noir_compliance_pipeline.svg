<text x="274" y="62" dominant-baseline="auto" style="fill:rgb(95, 94, 90);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle">gRPC</text>
<text x="406" y="62" dominant-baseline="auto" style="fill:rgb(95, 94, 90);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle">finding</text>
<text x="538" y="62" dominant-baseline="auto" style="fill:rgb(95, 94, 90);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle">50 rows / 2 s</text>
<rect x="20" y="198" width="112" height="48" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-dasharray:4 3"/>
