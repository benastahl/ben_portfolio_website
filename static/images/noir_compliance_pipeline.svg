<text x="76.0" y="232" dominant-baseline="central" style="fill:rgb(95, 94, 90);stroke:none;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle">-replay, no cluster</text>
